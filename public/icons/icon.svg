<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Outer Rounded Container with High Contrast Road Theme -->
  <rect width="512" height="512" rx="112" fill="#0B0F17" stroke="#F59E0B" stroke-width="12" />
  
  <!-- Subtle Asphalt Texture Glow -->
  <circle cx="256" cy="256" r="210" fill="url(#asphaltGlow)" opacity="0.15" />
  
  <!-- Perspective Road Highway -->
  <polygon points="216,130 296,130 380,390 132,390" fill="#18202F" stroke="#334155" stroke-width="4" />
  
  <!-- Road Highway Dashed Lines -->
  <line x1="256" y1="140" x2="256" y2="180" stroke="#FACC15" stroke-width="10" stroke-linecap="round" />
  <line x1="256" y1="210" x2="256" y2="260" stroke="#FACC15" stroke-width="12" stroke-linecap="round" />
  <line x1="256" y1="290" x2="256" y2="350" stroke="#FACC15" stroke-width="14" stroke-linecap="round" />
  
  <!-- Taxi Roof Sign Glow / Emblem -->
  <g filter="url(#glow)">
    <!-- Taxi Light Bar Top -->
    <rect x="186" y="80" width="140" height="42" rx="10" fill="#F59E0B" />
    <text x="256" y="108" fill="#0B0F17" font-size="22" font-family="system-ui, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="3">TAXI</text>
  </g>
  
  <!-- Venezuela Flag Ribbon Accent at Bottom -->
  <g transform="translate(156, 420)">
    <rect x="0" y="0" width="200" height="26" rx="8" fill="#111827" stroke="#374151" stroke-width="2" />
    <!-- Yellow, Blue, Red mini dots -->
    <circle cx="35" cy="13" r="6" fill="#FACC15" />
    <circle cx="55" cy="13" r="6" fill="#2563EB" />
    <circle cx="75" cy="13" r="6" fill="#DC2626" />
    <text x="135" y="19" fill="#F3F4F6" font-size="14" font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle" letter-spacing="1.5">VENEZUELA</text>
  </g>

  <defs>
    <radialGradient id="asphaltGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.5"/>
    </filter>
  </defs>
</svg>
